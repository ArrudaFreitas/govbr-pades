name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PSR-12 and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, json, openssl
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: composer audit --locked

      - run: vendor/bin/phpcs

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=256M

  tests:
    # 7.4 is the floor and the real runtime target; the newer versions only verify that
    # nothing quietly starts depending on post-7.4 behaviour.
    name: PHPUnit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, openssl
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpunit
